[project]
name = "stock-portfolio-analyst"
version = "0.1.0"
description = "Agno + Vercel AI Gateway stock portfolio analyst with live market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno<2",
    "openai",
    "streamlit>=1.66",
    "python-dotenv",
    "yfinance",
    "ddgs",
    "openpyxl",
    "snaptrade-python-sdk>=13",
    "cryptography",
]

[tool.vercel]
entrypoint = "asgi:app"
